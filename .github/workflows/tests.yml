name: TerraPlan tests

on:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install
        run: python -m pip install --disable-pip-version-check -e . pytest
      - name: Organizer control vectors V01-V10
        run: python -m terraplan control-cases
      - name: Unit and integration tests (incl. verify + independent recalculation of every committed results/ directory)
        run: python -m pytest -q
      - name: Verify every committed result directory from the CLI
        run: |
          python - <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          # core export layout only (result.json + plan.json); EXP-07..10 use experiments/provenance.py, checked by pytest
          dirs = sorted(p.parent for p in Path("results").rglob("run_manifest.json")
                        if (p.parent / "result.json").exists() and (p.parent / "plan.json").exists())
          bad = 0
          for d in dirs:
              rel = json.loads((d / "run_manifest.json").read_text(encoding="utf-8")).get("case_dir", "data/case")
              case = next((str(c) for c in (Path(rel), d / rel) if (c / "demand.csv").exists()), "data/case")
              for cmd in ([sys.executable, "-m", "terraplan", "verify", str(d), "--case", case],
                          [sys.executable, "tests/independent_recalc.py", str(d), case]):
                  r = subprocess.run(cmd, capture_output=True, text=True)
                  last = (r.stdout.strip().splitlines() or [r.stderr.strip()])[-1]
                  print(f"{d}: {last}")
                  bad += int(r.returncode != 0)
          print(f"{len(dirs)} каталогов результатов проверено, ошибок: {bad}")
          sys.exit(1 if bad or not dirs else 0)
          PY
      - name: Reproducibility smoke run (BASE + MANDATORY_STRESS)
        run: |
          python -m terraplan run --plan configs/plans/P3_isru_zbo.json --scenario BASE --out /tmp/ci_base --no-xlsx
          python -m terraplan run --plan configs/plans/P3_isru_zbo.json --scenario MANDATORY_STRESS --out /tmp/ci_stress --no-xlsx || test $? -eq 2
          python - <<'PY'
          import json
          a = json.load(open('/tmp/ci_base/run_manifest.json'))
          b = json.load(open('results/alternatives/P3_isru_zbo_BASE/run_manifest.json'))
          assert a['kpi_sha256'] == b['kpi_sha256'], f"KPI hash differs from committed results (precision {b.get('kpi_precision')} decimals): not reproducible"
          print('reproducible: kpi_sha256 matches committed results at', b.get('kpi_precision'), 'decimals')
          PY
