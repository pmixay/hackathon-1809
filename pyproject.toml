[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terraplan"
version = "0.1.0"
description = "TerraPlan — propellant supply planning circuit for an orbital fuel depot (CosmoHackathon 2026, case 2)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
terraplan = "terraplan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
terraplan = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
